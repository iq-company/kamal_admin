cluster_name: clust-dev
service_prefix: ab
git_repository: ""
path_prefix: ""
networks:
  Hetzner-001 | eu-central:
    type: private
    ipv4_range: 10.10.0.0/16
    subnet_size: 24
    network_zone: eu-central
    infrastructure_provider: Hetzner-001
  Public:
    type: public
node_pools:
  - name_prefix: null
    auth_groups:
      - Internal
      - Default
    count: true
    public_ipv4: true
    public_ipv6: false
    vm_type: cpx21
    image: ubuntu-24.04
    roles:
      - Backend
    networks:
      - network: Public
        open_ports:
          - 80
          - 443
        ports_opener_secret: Ports Opener
        ports_opener_port: 44443
        openable_ports:
          - 22
  - name_prefix: sowas
    auth_groups:
      - Internal
      - Default
    count: true
    public_ipv4: true
    public_ipv6: false
    vm_type: cpx21
    image: ubuntu-24.04
    roles:
      - Backend
    networks:
      - network: Public
        open_ports:
          - 80
          - 443
        ports_opener_secret: Ports Opener
        ports_opener_port: 44443
        openable_ports:
          - 22
      - network: Hetzner-001 | eu-central
        open_ports:
          - 80
          - 443
        ports_opener_secret: Ports Opener
        ports_opener_port: 44443
        openable_ports:
          - 22
hosts: []
secrets:
  Ports Opener:
    secret_type: Password
  asdf:
    secret_type: SSH Key
